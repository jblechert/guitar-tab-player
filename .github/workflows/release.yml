name: Build Windows Installer

# Trigger: push a tag like "v1.0.0"  →  builds .exe and creates a GitHub Release.
# Manual trigger also supported via workflow_dispatch.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pyfluidsynth numpy

      # ── FluidSynth DLL ────────────────────────────────────────────────────
      - name: Download FluidSynth Windows binaries
        shell: pwsh
        run: |
          $Url = "https://github.com/nicemozg/fluidsynth-binary-windows/releases/download/v2.3.4/fluidsynth-2.3.4-win64.zip"
          Invoke-WebRequest $Url -OutFile fs.zip -UseBasicParsing
          Expand-Archive fs.zip -DestinationPath fs_tmp
          # DLL lives in bin\ inside the archive
          $Dll = Get-ChildItem fs_tmp -Recurse -Filter "fluidsynth.dll" | Select-Object -First 1
          New-Item -ItemType Directory -Force build_windows | Out-Null
          Copy-Item $Dll.FullName build_windows\fluidsynth.dll
          Write-Host "Copied: $($Dll.FullName)"

      # ── SoundFont (small GeneralUser GS) ──────────────────────────────────
      - name: Download SoundFont
        shell: pwsh
        run: |
          # GeneralUser GS ~31 MB – free, Fluid licence compatible
          $Url = "https://github.com/nicemozg/fluidsynth-binary-windows/releases/download/v2.3.4/GeneralUser_GS_1.471.sf2"
          try {
            Invoke-WebRequest $Url -OutFile "build_windows\GeneralUser GS.sf2" -UseBasicParsing
          } catch {
            Write-Warning "SoundFont download failed – users will load one manually."
          }

      # ── Compile locales ───────────────────────────────────────────────────
      - name: Install gettext and compile .po files
        shell: pwsh
        run: |
          choco install gettext --no-progress -y
          $LocaleDir = "tabplayer\locale"
          Get-ChildItem "$LocaleDir\*\LC_MESSAGES\tabplayer.po" | ForEach-Object {
            $Mo = $_.FullName -replace '\.po$', '.mo'
            & msgfmt -o $Mo $_.FullName
            Write-Host "Compiled $($_.FullName)"
          }

      # ── PyInstaller ───────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: python -m PyInstaller guitar_tab_player.spec --noconfirm --clean

      # ── Inno Setup ────────────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC build_windows\installer.iss
          Write-Host "Installer built."

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTabPlayer-Setup
          path: dist/GuitarTabPlayer-Setup.exe

      # ── GitHub Release (only on tag push) ─────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GuitarTabPlayer-Setup.exe
          generate_release_notes: true
