name: Build Windows Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pyfluidsynth numpy

      # ── FluidSynth DLL (official FluidSynth/fluidsynth releases) ─────────
      - name: Download FluidSynth Windows binaries
        shell: pwsh
        run: |
          $Release = Invoke-RestMethod "https://api.github.com/repos/FluidSynth/fluidsynth/releases/latest"
          $Asset = $Release.assets | Where-Object { $_.name -match "win10-x64\.zip" } | Select-Object -First 1
          if (-not $Asset) {
            $Asset = $Release.assets | Where-Object { $_.name -match "\.zip$" } | Select-Object -First 1
          }
          Write-Host "Downloading $($Asset.name) …"
          Invoke-WebRequest $Asset.browser_download_url -OutFile fs.zip -UseBasicParsing
          Expand-Archive fs.zip -DestinationPath fs_tmp
          New-Item -ItemType Directory -Force build_windows | Out-Null
          # Copy every DLL from the archive into build_windows\
          Get-ChildItem fs_tmp -Recurse -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "build_windows\$($_.Name)" -Force
            Write-Host "  Copied: $($_.Name)"
          }
          # pyfluidsynth loads "fluidsynth" → needs fluidsynth.dll
          if (-not (Test-Path "build_windows\fluidsynth.dll")) {
            $Src = Get-ChildItem build_windows -Filter "libfluidsynth*.dll" | Select-Object -First 1
            if ($Src) {
              Copy-Item $Src.FullName "build_windows\fluidsynth.dll"
              Write-Host "  Aliased $($Src.Name) → fluidsynth.dll"
            }
          }

      # ── SoundFont (TimGM6mb – 5.7 MB, ships with Ubuntu/MuseScore) ───────
      - name: Download SoundFont
        shell: pwsh
        run: |
          $Urls = @(
            "https://github.com/gleitz/midi-js-soundfonts/raw/gh-pages/FluidR3_GM/soundfont.sf2",
            "https://raw.githubusercontent.com/musescore/MuseScore/master/share/sound/TimGM6mb.sf2"
          )
          $Ok = $false
          foreach ($Url in $Urls) {
            try {
              Invoke-WebRequest $Url -OutFile "build_windows\default.sf2" -UseBasicParsing
              Write-Host "SoundFont downloaded from $Url"
              $Ok = $true
              break
            } catch { continue }
          }
          if (-not $Ok) { Write-Warning "SoundFont download failed – app will ask user to load one." }

      # ── Compile locales ───────────────────────────────────────────────────
      - name: Compile .po locale files
        shell: pwsh
        run: |
          choco install gettext --no-progress -y 2>$null
          # Refresh PATH so msgfmt is visible
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + $env:PATH
          $LocaleDir = "tabplayer\locale"
          Get-ChildItem "$LocaleDir\*\LC_MESSAGES\tabplayer.po" | ForEach-Object {
            $Mo = $_.FullName -replace '\.po$', '.mo'
            try {
              & msgfmt -o $Mo $_.FullName
              Write-Host "Compiled $($_.Name)"
            } catch {
              Write-Warning "msgfmt failed for $($_.Name) – skipping"
            }
          }

      # ── PyInstaller ───────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: python -m PyInstaller guitar_tab_player.spec --noconfirm --clean

      # ── Inno Setup ────────────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC build_windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Write-Host "Installer built."

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTabPlayer-Setup
          path: dist/GuitarTabPlayer-Setup.exe

      # ── GitHub Release (only on tag push) ─────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GuitarTabPlayer-Setup.exe
          generate_release_notes: true
